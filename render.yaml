services:
  - type: web
    name: roadsense-backend
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r Backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir Backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: PORT
        value: 10000
