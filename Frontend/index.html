<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛣️</text></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>RoadSense AI — AI Road Condition Risk Prediction & Maintenance System</title>
    <meta name="description" content="AI-Based Road Condition Risk Prediction and Intelligent Maintenance Recommendation System using XGBoost and FastAPI" />
    <meta name="theme-color" content="#0A0E14" />

    <!-- DNS prefetch & Preconnect to critical assets -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Non-blocking Google Fonts with immediate fallback -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" />
    </noscript>

    <!-- Instant critical splash styling (<50ms First Contentful Paint) -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #0A0E14;
        color: #F8FAFC;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 35%, #151D28 0%, #0A0E14 75%);
        z-index: 99999;
      }
      .loader-logo-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 72px;
        height: 72px;
        border-radius: 18px;
        background: linear-gradient(135deg, rgba(59, 130, 246, 0.18), rgba(16, 185, 129, 0.12));
        border: 1px solid rgba(59, 130, 246, 0.35);
        box-shadow: 0 0 30px rgba(59, 130, 246, 0.22);
        margin-bottom: 18px;
        animation: rs-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .loader-title {
        font-size: 1.45rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #FFFFFF;
        margin: 0 0 6px 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .loader-badge {
        font-size: 0.68rem;
        background: rgba(59, 130, 246, 0.18);
        border: 1px solid rgba(59, 130, 246, 0.4);
        color: #60A5FA;
        padding: 2px 7px;
        border-radius: 5px;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .loader-subtext {
        font-size: 0.82rem;
        color: #94A3B8;
        margin: 0 0 22px 0;
      }
      .loader-bar-bg {
        width: 160px;
        height: 4px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }
      .loader-bar-fill {
        position: absolute;
        height: 100%;
        width: 40%;
        background: linear-gradient(90deg, #3B82F6, #10B981);
        border-radius: 999px;
        animation: rs-slide 1.4s ease-in-out infinite alternate;
      }
      @keyframes rs-slide {
        0% { left: 0%; width: 25%; }
        100% { left: 75%; width: 25%; }
      }
      @keyframes rs-pulse {
        0%, 100% { transform: scale(1); box-shadow: 0 0 25px rgba(59, 130, 246, 0.2); }
        50% { transform: scale(1.03); box-shadow: 0 0 38px rgba(59, 130, 246, 0.38); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader" aria-label="Loading RoadSense AI">
        <div class="loader-logo-wrap">
          <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19L9 5"/>
            <path d="M20 19L15 5"/>
            <path d="M12 8v2"/>
            <path d="M12 14v2"/>
          </svg>
        </div>
        <div class="loader-title">
          RoadSense <span style="color: #3B82F6">AI</span>
          <span class="loader-badge">Live</span>
        </div>
        <div class="loader-subtext">Initializing Civil Telemetry System...</div>
        <div class="loader-bar-bg">
          <div class="loader-bar-fill"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
